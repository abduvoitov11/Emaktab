name: eMaktab Smart Scheduler

on:
  schedule:
    # Vaqtlar UTC da berilgan (Toshkent vaqti = UTC + 5 soat):
    # Dushanba: 18:15 Toshkent (13:15 UTC)
    - cron: '15 13 * * 1'
    # Seshanba: 16:30 Toshkent (11:30 UTC)
    - cron: '30 11 * * 2'
    # Chorshanba: 17:45 Toshkent (12:45 UTC)
    - cron: '45 12 * * 3'
    # Payshanba: 15:20 Toshkent (10:20 UTC)
    - cron: '20 10 * * 4'
    # Juma: 08:30 Toshkent (03:30 UTC - soat 10:00 gacha to'liq yakunlanadi)
    - cron: '30 3 * * 5'

  workflow_dispatch:
    inputs:
      custom_day:
        description: "Qaysi kun rejasini ishga tushirish (auto / dushanba / seshanba / chorshanba / payshanba / juma)"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - dushanba
          - seshanba
          - chorshanba
          - payshanba
          - juma
      enable_jitter:
        description: "Boshlanishdan oldingi 1-5 daqiqa tasodifiy kutish (Anti-BAN)"
        required: false
        default: false
        type: boolean
      force_run:
        description: "Majburiy ishga tushirish (dam olish kuni bo'lsa ham)"
        required: false
        default: true
        type: boolean

jobs:
  run-emaktab:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Repozitoriyani yuklab olish
        uses: actions/checkout@v4

      - name: Python 3.10 sozlash
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Kutubxonalarni o'rnatish
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Playwright Chromium brauzerini o'rnatish
        run: |
          python -m playwright install --with-deps chromium

      - name: Skriptni ishga tushirish
        env:
          TZ: 'Asia/Tashkent'
          BOT_TOKEN: ${{ secrets.BOT_TOKEN || '8375587042:AAGfQNUc_3LzpTHBIPsyNHxw8AHfFV9CyXU' }}
          SUPER_ADMIN_ID: ${{ secrets.SUPER_ADMIN_ID || '6291811673' }}
          ENABLE_JITTER: ${{ github.event.inputs.enable_jitter || 'true' }}
          CUSTOM_DAY: ${{ github.event.inputs.custom_day || 'auto' }}
          FORCE_RUN: ${{ github.event.inputs.force_run || 'false' }}
        run: |
          python cron_runner.py
