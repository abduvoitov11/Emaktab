name: eMaktab Smart Scheduler

on:
  schedule:
    - cron: '15 12 * * 1'
    - cron: '45 11 * * 2'
    - cron: '30 12 * * 3'
    - cron: '20 11 * * 4'
    - cron: '45 10 * * 6'
    - cron: '0 14 * * 1,2,3,4,6'

  workflow_dispatch:
    inputs:
      custom_day:
        description: "Qaysi kun rejasini ishga tushirish (auto / dushanba / seshanba / chorshanba / payshanba / shanba)"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - dushanba
          - seshanba
          - chorshanba
          - payshanba
          - shanba
          - yakshanba
      enable_jitter:
        description: "Boshlanishdan oldingi 1-5 daqiqa tasodifiy kutish (Anti-BAN)"
        required: false
        default: true
        type: boolean
      force_run:
        description: "Majburiy ishga tushirish (Qoidaga qaramasdan)"
        required: false
        default: true
        type: boolean
      all_accounts:
        description: "Barcha hisoblarga to'liq kirish"
        required: false
        default: false
        type: boolean

jobs:
  run-emaktab:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Repozitoriyani yuklab olish
        uses: actions/checkout@v4

      - name: Python 3.12 sozlash
        uses: actions/setup-python@v5
        with:
            python-version: '3.12'
          cache: 'pip'

      - name: Tizim kutubxonalarini tekshirish (FFmpeg)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Python kutubxonalarini o'rnatish
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Playwright Chromium brauzerini o'rnatish
        run: |
          python -m playwright install --with-deps chromium

      - name: Skriptni ishga tushirish (Rasm + Video)
        env:
          TZ: 'Asia/Tashkent'
          BOT_TOKEN: ${{ secrets.BOT_TOKEN || '8375587042:AAGfQNUc_3LzpTHBIPsyNHxw8AHfFV9CyXU' }}
          SUPER_ADMIN_ID: ${{ secrets.SUPER_ADMIN_ID || '6291811673' }}
          ENABLE_JITTER: ${{ github.event.inputs.enable_jitter || 'true' }}
          CUSTOM_DAY: ${{ github.event.inputs.custom_day || 'auto' }}
          FORCE_RUN: ${{ github.event.inputs.force_run || 'false' }}
          ALL_ACCOUNTS: ${{ github.event.inputs.all_accounts || 'false' }}
          EXCEL_BASE64: ${{ secrets.EXCEL_BASE64 }}
        run: |
          python cron_runner.py
