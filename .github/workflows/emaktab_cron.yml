name: eMaktab Smart Scheduler

on:
  schedule:
    # Vaqtlar UTC da berilgan (Toshkent vaqti = UTC + 5 soat):
    # 1. Shanba (sekin boshlanadi): 16:30 Toshkent (11:30 UTC)
    - cron: '30 11 * * 6'
    # 2. Yakshanba: 18:00 Toshkent (13:00 UTC)
    - cron: '0 13 * * 0'
    # 3. Dushanba: 18:15 Toshkent (13:15 UTC)
    - cron: '15 13 * * 1'
    # 4. Seshanba: 16:45 Toshkent (11:45 UTC)
    - cron: '45 11 * * 2'
    # 5. Chorshanba: 17:30 Toshkent (12:30 UTC)
    - cron: '30 12 * * 3'
    # 6. Payshanba: 15:40 Toshkent (10:40 UTC)
    - cron: '40 10 * * 4'
    # JUMA KUNI UMUMAN ISHLAMAYDI (DAM OLISH KUNI)

  workflow_dispatch:
    inputs:
      custom_day:
        description: "Qaysi kun rejasini ishga tushirish (auto / shanba / yakshanba / dushanba / seshanba / chorshanba / payshanba)"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - shanba
          - yakshanba
          - dushanba
          - seshanba
          - chorshanba
          - payshanba
      enable_jitter:
        description: "Boshlanishdan oldingi 1-5 daqiqa tasodifiy kutish (Anti-BAN)"
        required: false
        default: false
        type: boolean
      force_run:
        description: "Majburiy ishga tushirish (Juma kuni bo'lsa ham)"
        required: false
        default: true
        type: boolean
      all_accounts:
        description: "Barcha 35 ta hisobga to'liq kirish (Ierarxiya bo'yicha)"
        required: false
        default: false
        type: boolean

jobs:
  run-emaktab:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Repozitoriyani yuklab olish
        uses: actions/checkout@v4

      - name: Python 3.10 sozlash
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Tizim kutubxonalarini tekshirish (FFmpeg)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Python kutubxonalarini o'rnatish
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Playwright Chromium brauzerini o'rnatish
        run: |
          python -m playwright install --with-deps chromium

      - name: Skriptni ishga tushirish (Rasm + Video)
        env:
          TZ: 'Asia/Tashkent'
          BOT_TOKEN: ${{ secrets.BOT_TOKEN || '8375587042:AAGfQNUc_3LzpTHBIPsyNHxw8AHfFV9CyXU' }}
          SUPER_ADMIN_ID: ${{ secrets.SUPER_ADMIN_ID || '6291811673' }}
          ENABLE_JITTER: ${{ github.event.inputs.enable_jitter || 'true' }}
          CUSTOM_DAY: ${{ github.event.inputs.custom_day || 'auto' }}
          FORCE_RUN: ${{ github.event.inputs.force_run || 'false' }}
          ALL_ACCOUNTS: ${{ github.event.inputs.all_accounts || 'false' }}
        run: |
          python cron_runner.py
